<title>Where in the World?</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--surface:#161b22;--card:#1c2333;--card-hover:#242d3d;
  --red:#c41e3a;--red-glow:rgba(196,30,58,0.25);--gold:#d4a843;--gold-dim:rgba(212,168,67,0.12);
  --teal:#2da891;--teal-dim:rgba(45,168,145,0.12);--danger:#da3633;
  --text:#e6edf3;--text2:#7d8590;--text3:#484f58;
  --radius:10px;--radius-sm:6px;
}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;z-index:1}
.screen.active{display:flex}
.overlay{background:rgba(0,0,0,0.88);z-index:50;justify-content:center;align-items:center}

#s-title{background:linear-gradient(160deg,#0d1117 0%,#1a1428 40%,#0d1117 100%);justify-content:center;align-items:center;text-align:center;padding:24px}
.title-globe{font-size:64px;margin-bottom:8px;animation:spin 20s linear infinite}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
#s-title h1{font-family:'Playfair Display',Georgia,serif;font-size:28px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--red);margin-bottom:4px}
#s-title .sub{color:var(--text2);font-size:13px;letter-spacing:2.5px;text-transform:uppercase;margin-bottom:20px}
.diff-row{display:flex;gap:8px;justify-content:center;margin-bottom:20px}
.diff-chip{padding:8px 16px;border-radius:20px;border:1px solid var(--text3);background:transparent;color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit;letter-spacing:.5px}
.diff-chip:hover{border-color:var(--text2)}
.diff-chip.active{border-color:var(--gold);color:var(--gold);background:var(--gold-dim)}
.diff-desc{color:var(--text3);font-size:11px;margin-bottom:20px;min-height:16px}
.title-rank{color:var(--gold);font-size:13px;margin-bottom:20px}

#s-briefing{background:var(--bg);justify-content:center;align-items:center;padding:24px}
.briefing-card{background:var(--surface);border:1px solid var(--red);border-radius:var(--radius);padding:24px 20px;max-width:440px;width:100%;animation:fadeUp .4s ease}
.briefing-card .badge{display:inline-block;background:var(--red);color:#fff;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:4px 10px;border-radius:3px;margin-bottom:14px}
.briefing-card h2{font-family:'Playfair Display',Georgia,serif;font-size:17px;margin-bottom:10px;color:var(--gold)}
.briefing-card p{font-size:13px;line-height:1.6;color:var(--text2);margin-bottom:10px}
.briefing-card .stolen{color:var(--text);font-weight:600}
.briefing-card .origin{color:var(--teal)}

#s-city{background:var(--bg)}
#hud{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:var(--surface);border-bottom:1px solid rgba(255,255,255,.05);font-size:12px;font-weight:600;flex-shrink:0}
#hud .time{color:var(--gold)}
#hud .rank{color:var(--text2)}
.city-art{width:100%;display:block;flex-shrink:0}
#city-header{padding:10px 16px 4px;text-align:center;flex-shrink:0}
#city-header .flag{font-size:28px}
#city-header h2{font-family:'Playfair Display',Georgia,serif;font-size:18px;font-weight:700;margin:2px 0 1px}
#city-header .country{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:1.5px}
#city-body{flex:1;overflow-y:auto;padding:0 14px 6px;display:flex;flex-direction:column;gap:8px}
#city-desc{font-size:12px;line-height:1.55;color:var(--text2);text-align:center;max-width:440px;margin:0 auto 2px}
.msg{background:var(--card);border-radius:var(--radius);padding:12px 14px;font-size:13px;line-height:1.55;animation:fadeUp .2s ease}
.msg.clue{border-left:3px solid var(--gold);background:var(--gold-dim)}
.msg.alert{border-left:3px solid var(--red);background:var(--red-glow)}
.msg.info{border-left:3px solid var(--teal);background:var(--teal-dim)}
.msg .lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;color:var(--gold)}
.msg.alert .lbl{color:var(--red)}
.msg.info .lbl{color:var(--teal)}
#actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 14px;background:var(--surface);border-top:1px solid rgba(255,255,255,.05);flex-shrink:0}
.act{background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:var(--radius-sm);padding:10px 8px;color:var(--text);font-size:12px;font-weight:600;cursor:pointer;transition:transform .1s,background .15s;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:5px;text-align:center}
.act:active{transform:scale(.96)}
.act:hover{background:var(--card-hover)}
.act.primary{background:var(--red);border-color:var(--red);color:#fff}
.act.primary:hover{background:#a5182f}
.act.go-back{background:#1a2a25;border-color:var(--teal);color:var(--teal)}
.act.travel{background:#1a3a33;border-color:var(--teal);color:var(--teal)}
.act.cold{background:#2a1a1a;border-color:var(--danger);color:var(--danger)}
.act.full{grid-column:1/-1}
.act:disabled{opacity:.3;pointer-events:none}

.panel{background:var(--surface);border-radius:var(--radius);padding:18px;width:92%;max-width:440px;max-height:82vh;overflow-y:auto;animation:fadeUp .2s ease;display:flex;flex-direction:column;gap:8px}
.panel h2{font-family:'Playfair Display',Georgia,serif;font-size:17px;text-align:center;margin-bottom:2px}
.dest{background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:var(--radius-sm);padding:12px 14px;color:var(--text);font-size:13px;cursor:pointer;text-align:left;transition:background .15s,border-color .15s;font-family:inherit;display:flex;align-items:center;gap:10px}
.dest:hover{background:var(--card-hover);border-color:var(--teal)}
.dest:active{transform:scale(.98)}
.dest .df{font-size:24px}
.dest .dc{font-weight:600}
.dest .dk{font-size:11px;color:var(--text2)}

.dsec{margin-bottom:10px}
.dsec h3{font-size:12px;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;padding-bottom:3px;border-bottom:1px solid rgba(255,255,255,.06)}
.trow{display:flex;justify-content:space-between;padding:5px 0;font-size:12px;border-bottom:1px solid rgba(255,255,255,.03)}
.trow .tl{color:var(--text2)}
.trow .tv{font-weight:600}
.trow .tv.unk{color:var(--text3);font-style:italic;font-weight:400}
.scard{background:var(--card);border:1px solid rgba(255,255,255,.05);border-radius:var(--radius-sm);padding:10px;display:flex;align-items:center;gap:10px}
.scard.elim{opacity:.25}
.scard.match{border-color:var(--gold);background:var(--gold-dim)}
.portrait{width:56px;height:auto;border-radius:5px;flex-shrink:0;border:1px solid rgba(255,255,255,.1)}
.scard .si{flex:1;min-width:0}
.scard .sn{font-size:13px;font-weight:600}
.scard .st{font-size:10px;color:var(--text2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbtn{background:var(--red);color:#fff;border:none;border-radius:var(--radius-sm);padding:6px 10px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0}
.wbtn:active{transform:scale(.95)}
.wbtn:disabled{opacity:.4;pointer-events:none}
.elog{font-size:11px;color:var(--text2);line-height:1.5;padding:2px 0;list-style:none}
.elog li{margin-bottom:3px;padding-left:10px;position:relative}
.elog li::before{content:'';position:absolute;left:0;top:6px;width:4px;height:4px;border-radius:50%;background:var(--gold)}
.elog li.sc::before{background:var(--red)}

#s-flight{background:var(--bg);justify-content:center;align-items:center;text-align:center;padding:24px;z-index:40}
.flight-label{font-family:'Playfair Display',Georgia,serif;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--teal);margin-bottom:14px;animation:fadeUp .3s ease}
.flight-map{width:100%;max-width:420px;border-radius:var(--radius);border:1px solid rgba(255,255,255,.06);background:#080c12}
.flight-route{font-size:14px;color:var(--text);margin-top:12px;font-weight:600;animation:fadeUp .4s ease}
.flight-route .fa{color:var(--gold)}
.flight-route .arrow{color:var(--teal);margin:0 6px}
.flight-route .fb{color:var(--teal)}
.flight-cost{font-size:11px;color:var(--text3);margin-top:4px}

#s-result{background:var(--bg);justify-content:center;align-items:center;text-align:center;padding:24px}
.rcard{background:var(--surface);border-radius:var(--radius);padding:28px 22px;max-width:440px;width:100%;animation:fadeUp .4s ease}
.rcard h2{font-family:'Playfair Display',Georgia,serif;font-size:22px;margin-bottom:6px}
.rcard.win h2{color:var(--teal)}
.rcard.lose h2{color:var(--danger)}
.rcard p{font-size:13px;color:var(--text2);line-height:1.55;margin-bottom:6px}
.rcard .ru{color:var(--gold);font-weight:600;font-size:15px;margin:10px 0}

.btn{border:none;border-radius:var(--radius-sm);padding:13px 28px;font-size:14px;font-weight:600;cursor:pointer;transition:transform .1s;min-width:160px;font-family:inherit}
.btn:active{transform:scale(.96)}
.btn-red{background:var(--red);color:#fff}
.btn-red:hover{background:#a5182f}
.btn-out{background:transparent;border:1px solid var(--text3);color:var(--text)}
.btn-out:hover{border-color:var(--text2)}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulseGlow{0%,100%{opacity:.6}50%{opacity:1}}
@media(max-height:540px){.city-art{max-height:60px}#city-header{padding:6px 14px 2px}#city-header .flag{font-size:20px}#city-header h2{font-size:15px}#city-desc{display:none}}
</style>

<div id="s-title" class="screen active">
  <div class="title-globe">🌍</div>
  <h1>Where in the World?</h1>
  <p class="sub">An ACME Detective Adventure</p>
  <div class="diff-row">
    <button class="diff-chip" data-d="easy">Easy</button>
    <button class="diff-chip active" data-d="medium">Medium</button>
    <button class="diff-chip" data-d="hard">Hard</button>
  </div>
  <div class="diff-desc" id="diff-desc">18 hours · Standard investigation</div>
  <div class="title-rank" id="title-rank"></div>
  <button class="btn btn-red" id="btn-new">Accept Your Next Case</button>
</div>

<div id="s-briefing" class="screen">
  <div class="briefing-card">
    <span class="badge">Urgent Transmission</span>
    <h2 id="b-title"></h2>
    <p id="b-body"></p>
    <p style="color:var(--text2);font-size:12px;margin-bottom:14px" id="b-foot"></p>
    <button class="btn btn-red" style="width:100%" id="btn-go">Take the Case</button>
  </div>
</div>

<div id="s-city" class="screen">
  <div id="hud"><span class="time" id="hud-t"></span><span class="rank" id="hud-r"></span></div>
  <div id="city-art-wrap"></div>
  <div id="city-header"><span class="flag" id="c-flag"></span><h2 id="c-name"></h2><span class="country" id="c-country"></span></div>
  <p id="city-desc"></p>
  <div id="city-body"></div>
  <div id="actions"></div>
</div>

<div id="s-flight" class="screen">
  <div id="flight-content"></div>
</div>

<div id="s-travel" class="screen overlay">
  <div class="panel"><h2>✈️ Travel</h2><p style="font-size:12px;color:var(--text2);text-align:center" id="travel-cost"></p><div id="travel-list"></div><button class="btn btn-out" style="width:100%" id="btn-cancel-t">Cancel</button></div>
</div>

<div id="s-dossier" class="screen overlay">
  <div class="panel" id="dossier-c"></div>
</div>

<div id="s-result" class="screen">
  <div class="rcard" id="rcard"><h2 id="r-title"></h2><p id="r-body"></p><p class="ru" id="r-rank"></p><button class="btn btn-red" style="margin-top:14px" id="btn-next">Next Case</button></div>
</div>

<script>
const CITIES={
paris:{name:"Paris",country:"France",flag:"🇫🇷",region:"Europe",

  look:["The Louvre houses over 380,000 works of art including the Mona Lisa. Its glass pyramid entrance, controversial when built in 1989, has become an icon.","Along the Seine, bouquinistes — open-air booksellers — have been a tradition since the 16th century. Notre-Dame Cathedral has watched over the river for over 800 years."],
  clues:["They asked about the exchange rate for euros.","I overheard them talking about a tower built by Gustave Eiffel.","They were learning French phrases — kept saying 'bonjour.'","They asked about museums with famous Renaissance paintings.","They mentioned heading to the 'City of Light.'"]},

  desc:"Neon signs and ancient temples exist side by side. Shibuya Crossing pulses with thousands of pedestrians while tranquil gardens offer moments of zen.",
  look:["Tsukiji Outer Market is a feast for the senses. Japan's fishing industry has fed the nation for centuries, and Tokyo remains one of the world's great food capitals.","In Ueno Park, cherry blossoms bloom each spring in a tradition called hanami. The Tokyo National Museum nearby houses Japan's largest collection of art and antiquities."],
  clues:["They were exchanging money for Japanese yen.","They mentioned wanting to ride the Shinkansen bullet train.","They asked about cherry blossom season — 'sakura,' they called it.","They had a guidebook about Shinto shrines and Buddhist temples.","They were heading to an island nation in the Pacific."]},

  look:["The Great Pyramid of Giza, built around 2560 BCE, was the tallest structure in the world for nearly 4,000 years. The Sphinx has guarded the plateau just as long.","The Egyptian Museum holds treasures including the golden death mask of Tutankhamun. The Nile, flowing 6,650 km, has been Egypt's lifeline for millennia."],
  clues:["They were fascinated by ancient pyramids and pharaohs.","They asked about cruises on the longest river in Africa.","They mentioned wanting to see hieroglyphics and mummies.","They were researching the Valley of the Kings.","They mentioned a great city on the banks of the Nile."]},
rio:{name:"Rio de Janeiro",country:"Brazil",flag:"🇧🇷",region:"South America",
  desc:"Sugar Loaf Mountain rises from the bay and Christ the Redeemer watches from Corcovado. Rio pulses with samba rhythms, golden beaches, and carnival color.",
  look:["Christ the Redeemer, standing 30 meters tall atop Corcovado mountain, is one of the New Seven Wonders. It was completed in 1931 after nine years of construction.","Copacabana and Ipanema are among the world's most famous beaches. Rio's Carnival draws millions of visitors to watch samba schools compete in spectacular parades."],
  clues:["They mentioned a giant statue of Christ on a mountaintop.","They asked about Carnival and samba dancing.","They were learning Portuguese phrases.","They mentioned Copacabana Beach and Sugar Loaf Mountain.","They were heading to a coastal city in South America."]},
sydney:{name:"Sydney",country:"Australia",flag:"🇦🇺",region:"Oceania",
  desc:"The Opera House's white sails catch the afternoon light across the harbor. Sydney is a sun-drenched metropolis where the Pacific meets stunning coastal cliffs.",
  look:["The Sydney Opera House, designed by Danish architect Jørn Utzon, hosts over 1,500 performances each year. Its roof tiles were inspired by peeling an orange.","The Harbour Bridge, nicknamed 'The Coathanger,' connects the city's shores. Australia is the only country that is also a continent, home to unique wildlife found nowhere else."],
  clues:["They mentioned an opera house shaped like sails on a harbor.","They asked about koalas and kangaroos.","They were booking a flight deep into the Southern Hemisphere.","They mentioned climbing a famous harbor bridge.","They were heading to a continent that's also a country."]},
london:{name:"London",country:"England",flag:"🇬🇧",region:"Europe",
  desc:"Big Ben chimes over the Thames as black cabs weave through centuries of history. London has been a world capital of finance, theatre, and tea since the Romans.",
  look:["The Tower of London has served as palace, prison, and treasury since 1066. The Crown Jewels are still kept here under heavy guard.","The British Museum houses over 8 million works, including the Rosetta Stone. Admission is free — a tradition since the museum's founding in 1753."],
  clues:["They mentioned Big Ben and the Houses of Parliament.","They were exchanging money for pounds sterling.","They asked about the changing of the guard at Buckingham Palace.","They mentioned riding a red double-decker bus.","They were heading to a city on the River Thames."]},

  desc:"The Gateway of India rises at the waterfront while tiffin-wallahs deliver millions of lunches through bustling streets. Mumbai is the heart of Bollywood.",
  look:["The Gateway of India, built in 1924, is Mumbai's most iconic landmark. The city's dabbawalas deliver over 200,000 home-cooked lunches daily with near-perfect accuracy.","Bollywood produces over 1,500 films per year — more than Hollywood. Mumbai's local trains carry 7.5 million commuters daily."],
  clues:["They mentioned the Gateway of India.","They were exchanging money for Indian rupees.","They asked about Bollywood film studios.","They mentioned a bustling city on India's west coast.","They were practicing 'namaste.'"]},
marrakech:{name:"Marrakech",country:"Morocco",flag:"🇲🇦",region:"Africa",
  desc:"The Red City glows in the afternoon sun. The ancient medina is a labyrinth of narrow alleys, vibrant souks, and the call to prayer echoing from minarets.",
  look:["Jemaa el-Fnaa, the main square, transforms from daytime market to open-air kitchen at dusk. Snake charmers and storytellers have performed here for a thousand years.","The souks are organized by trade — leatherworkers, spice merchants, metalworkers — a system unchanged since medieval times. The Atlas Mountains rise to over 4,000 meters nearby."],
  clues:["They mentioned a famous marketplace called a souk.","They asked about the Atlas Mountains.","They were excited about a city known for its red walls.","They mentioned drinking traditional mint tea.","They were heading to a North African kingdom."]},
bangkok:{name:"Bangkok",country:"Thailand",flag:"🇹🇭",region:"Asia",
  desc:"Golden temple spires pierce the tropical sky above a city of canals and night markets. Bangkok is a sensory overload of ornate architecture and sizzling street food.",
  look:["Wat Phra Kaew, the Temple of the Emerald Buddha, sits within the Grand Palace and is Thailand's most sacred Buddhist temple, established in 1782.","Bangkok's street food is legendary. The city was once called the 'Venice of the East' for its canal system, which still serves as a transport network today."],
  clues:["They mentioned ornate Buddhist temples with golden spires.","They were exchanging money for Thai baht.","They asked about floating markets and street food.","They were heading to the capital of a Southeast Asian kingdom.","They mentioned wanting to ride in a tuk-tuk."]},
rome:{name:"Rome",country:"Italy",flag:"🇮🇹",region:"Europe",
  desc:"The Eternal City layers three thousand years of history beneath your feet. The Colosseum casts long shadows at sunset while Vespas zip past ancient fountains.",
  look:["The Colosseum, completed in 80 CE, could seat 50,000 spectators. It pioneered the use of arches and concrete — engineering principles still used today.","Tossing a coin into the Trevi Fountain is said to ensure your return. The Vatican, the world's smallest state, houses Michelangelo's Sistine Chapel ceiling."],
  clues:["They mentioned the Colosseum and ancient gladiators.","They were exchanging euros and dreaming of pasta.","They asked about visiting the Vatican.","They mentioned throwing coins in a famous Baroque fountain.","They were brushing up on Italian — 'ciao, bella!'"]},
mexico_city:{name:"Mexico City",country:"Mexico",flag:"🇲🇽",region:"North America",
  desc:"Built on the ruins of Aztec Tenochtitlan, Mexico City is one of the world's largest metropolises. Ancient pyramids, murals, and the aroma of street tacos define this city of layers.",

  clues:["They mentioned ancient Aztec pyramids and ruins.","They were exchanging money for Mexican pesos.","They asked about a famous painter in a blue house.","They mentioned a city built on Tenochtitlan.","They were practicing their Spanish."]},

  desc:"Minarets and church domes share the skyline in the only city spanning two continents. Istanbul straddles the Bosphorus, connecting Europe and Asia.",

  clues:["They mentioned a city straddling two continents.","They asked about the Hagia Sophia and Blue Mosque.","They were exchanging money for Turkish lira.","They mentioned one of the world's oldest bazaars.","They asked about a strait connecting the Black Sea to the Mediterranean."]},
nairobi:{name:"Nairobi",country:"Kenya",flag:"🇰🇪",region:"Africa",
  desc:"Skyscrapers rise beside a national park where lions roam within sight of the city. Nairobi is East Africa's largest city, a tech hub and safari gateway.",
  look:["Nairobi National Park is the only wildlife reserve within a major capital. Giraffes, zebras, and rhinos roam against a backdrop of skyscrapers.","Kenya's Great Rift Valley stretches 6,000 km from Lebanon to Mozambique. It's so vast it can be seen from space, and its lakes support millions of flamingos."],
  clues:["They mentioned going on an African safari.","They asked about the Great Rift Valley.","They were exchanging money for Kenyan shillings.","They mentioned a city where you can see lions from downtown.","They asked about the 'Big Five' — lion, leopard, elephant, buffalo, rhino."]},
reykjavik:{name:"Reykjavik",country:"Iceland",flag:"🇮🇸",region:"Europe",
  desc:"The world's northernmost capital sits where tectonic plates pull apart. Reykjavik is a city of hot springs, Northern Lights, and alien landscapes.",
  look:["Iceland sits on the Mid-Atlantic Ridge where two tectonic plates meet. Geothermal energy heats 90% of homes — you can swim outdoors in naturally heated pools even in winter.","The Northern Lights are visible from September to April. Iceland's landscape includes active volcanoes, glaciers covering 11% of the land, and geysers — the word itself comes from Icelandic."],
  clues:["They mentioned the Northern Lights — the aurora borealis.","They asked about geysers and natural hot springs.","They were excited about glaciers and volcanoes in the same country.","They mentioned a city near the Arctic Circle.","They were heading to a 'land of fire and ice.'"]},
buenos_aires:{name:"Buenos Aires",country:"Argentina",flag:"🇦🇷",region:"South America",
  desc:"Tango drifts from the milongas of San Telmo as grilling steak fills the evening air. Buenos Aires is South America's most European-feeling city.",
  look:["La Boca, with its brightly painted buildings, is the birthplace of tango. The dance originated in the port neighborhoods of the 1880s.","Buenos Aires has the widest avenue in the world — Avenida 9 de Julio spans 140 meters. The Teatro Colón is considered one of the world's finest opera houses."],
  clues:["They mentioned tango dancing in cobblestone streets.","They were exchanging money for Argentine pesos.","They asked about the best parrillas — steakhouses.","They called their destination the 'Paris of South America.'","They mentioned a city on the Río de la Plata."]},
new_york:{name:"New York",country:"USA",flag:"🇺🇸",region:"North America",
  desc:"The city that never sleeps towers above the Hudson. Lady Liberty holds her torch high while yellow cabs stream through canyon-like streets below.",
  look:["The Statue of Liberty, a gift from France in 1886, stands 93 meters tall. Her torch was the first thing millions of immigrants saw arriving at nearby Ellis Island.","Central Park spans 341 hectares in the heart of Manhattan. Its creation in 1858 required moving more earth than the digging of the Panama Canal."],

  if(f.includes('mustache'))return'<path d="M30 52Q25 48 20 50Q24 54 32 52" fill="#3a2a1a"/><path d="M50 52Q55 48 60 50Q56 54 48 52" fill="#3a2a1a"/><path d="M32 52Q40 54.5 48 52" fill="none" stroke="#3a2a1a" stroke-width=".5"/><path d="M28 51Q24 49 21 50" fill="none" stroke="#4a3a2a" stroke-width=".4"/><path d="M52 51Q56 49 59 50" fill="none" stroke="#4a3a2a" stroke-width=".4"/><path d="M30 52.5Q26 51 22 51.5" fill="none" stroke="#2a1a0a" stroke-width=".3"/><path d="M50 52.5Q54 51 58 51.5" fill="none" stroke="#2a1a0a" stroke-width=".3"/>';
  return'';
}

let S={rank:0,casesWon:0,casesPlayed:0,diff:'medium'};
let C=null;

function loadP(){try{const d=localStorage.getItem('acme_detective2');if(d){const p=JSON.parse(d);S.rank=p.rank||0;S.casesWon=p.casesWon||0;S.casesPlayed=p.casesPlayed||0;S.diff=p.diff||'medium';}}catch(e){}}
function saveP(){try{localStorage.setItem('acme_detective2',JSON.stringify(S));}catch(e){}}

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

function newCase(){
  const d=DIFF[S.diff];
  const item=ITEMS[Math.floor(Math.random()*ITEMS.length)];
  const suspect=SUSPECTS[Math.floor(Math.random()*SUSPECTS.length)];
  const origin=item.origin;
  const others=CIDS.filter(c=>c!==origin);
  const trailCities=shuffle(others).slice(0,d.trail-1);
  const trail=[origin,...trailCities];
  const usedTraits=new Set();
  const cq={};
  for(let i=0;i<trail.length;i++){
    const city=trail[i],isLast=i===trail.length-1;
    let search,witness,airport=[];
    if(isLast){
      search=[{type:'alert',text:'Witnesses report seeing someone matching the suspect just minutes ago. The suspect is HERE — issue a warrant and make the arrest!'}];
      airport=[{type:'info',text:'No outbound flights booked — the suspect may still be in this city!'}];
    }else{
      const next=trail[i+1];
      const pool=shuffle([...CITIES[next].clues]);
      search=pool.slice(0,2).map(t=>({type:'destination',text:t}));
      airport=[{type:'region',text:'Airport records show the suspect booked passage toward '+CITIES[next].region+'.'}];
    }
    const avail=CATS.filter(t=>!usedTraits.has(t));
    const pick=shuffle(avail).slice(0,Math.min(2,avail.length));
    pick.forEach(t=>usedTraits.add(t));
    witness=pick.map(cat=>({type:'suspect',text:suspect.traitText[cat],category:cat,value:suspect[cat]}));
    if(isLast){
      const extra=CATS.filter(t=>!usedTraits.has(t));
      if(extra.length>0){const cat=extra[0];usedTraits.add(cat);witness.push({type:'suspect',text:suspect.traitText[cat],category:cat,value:suspect[cat]});}
    }
    cq[city]={search,witness,airport,si:0,wi:0,ai:0};
  }
  C={item,suspect,trail,currentCity:origin,trailIdx:0,hours:d.hours,
    dossier:{hair:null,food:null,hobby:null,feature:null},
    cluesFound:[],cq,warrant:null,msgs:[],lookUsed:{},atDeadEnd:false};
}

function getTravel(){
  const d=DIFF[S.diff];
  const correct=C.trailIdx<C.trail.length-1?C.trail[C.trailIdx+1]:null;
  const exclude=new Set(C.trail);exclude.add(C.currentCity);
  if(C.atDeadEnd&&correct)exclude.delete(correct);
  let pool=CIDS.filter(c=>!exclude.has(c)&&c!==C.currentCity);
  const decoys=shuffle(pool).slice(0,d.decoys);
  const options=correct?shuffle([correct,...decoys]):shuffle(decoys.slice(0,d.decoys+1));
  return{options,correct};
}

function doSearch(){
  if(C.hours<1)return;
  const q=C.cq[C.currentCity];
  if(!q||q.si>=q.search.length){addMsg('info','Investigation','You have searched everywhere here. No more leads.');return;}
  C.hours--;
  const clue=q.search[q.si++];
  const intro=INTROS[Math.floor(Math.random()*INTROS.length)];
  const text=clue.type==='alert'?clue.text:intro+' "'+clue.text+'"';
  C.cluesFound.push({...clue,displayText:text,city:C.currentCity});
  addMsg(clue.type==='alert'?'alert':'clue',clue.type==='alert'?'Alert':'Clue Found',text);
  renderCity();
}

function doWitness(){
  if(C.hours<1)return;
  const q=C.cq[C.currentCity];
  if(!q||q.wi>=q.witness.length){addMsg('info','Witnesses','No one else here has seen the suspect.');return;}
  C.hours--;
  const clue=q.witness[q.wi++];
  const intro=INTROS[Math.floor(Math.random()*INTROS.length)];
  const text=intro+' "'+clue.text+'"';
  C.cluesFound.push({...clue,displayText:text,city:C.currentCity});
  C.dossier[clue.category]=clue.value;
  addMsg('clue','Witness Report',text);
  renderCity();
}

function doAirport(){
  if(C.hours<1)return;
  const q=C.cq[C.currentCity];
  if(!q||q.ai>=q.airport.length){addMsg('info','Airport','No more records to check here.');return;}
  C.hours--;
  const clue=q.airport[q.ai++];
  C.cluesFound.push({...clue,displayText:clue.text,city:C.currentCity});
  addMsg(clue.type==='alert'?'alert':'info','Airport Records',clue.text);
  renderCity();
}

function doTravel(cityId){
  const cost=DIFF[S.diff].travel;
  if(C.hours<cost)return;
  C.hours-=cost;
  const data=getTravel();
  const fromCity=C.currentCity;
  hideScr('s-travel');
  showFlight(fromCity,cityId,()=>{
    C.currentCity=cityId;
    if(cityId===data.correct){C.trailIdx++;C.atDeadEnd=false;}
    else{C.atDeadEnd=true;}
    C.msgs=[];
    if(C.atDeadEnd)addMsg('info','Dead End','You search the area but find no trace of the suspect. The trail must lead elsewhere — check your clues and try another destination.');
    renderCity();
  });
}

function doGoBack(){
  if(C.hours<1||!C.atDeadEnd)return;
  C.hours-=1;
  const fromCity=C.currentCity;
  const toCity=C.trail[C.trailIdx];
  showFlight(fromCity,toCity,()=>{
    C.currentCity=toCity;
    C.atDeadEnd=false;
    C.msgs=[];
    addMsg('info','Returned','You retrace your steps back to '+CITIES[C.currentCity].name+'. The trail continues from here.');
    renderCity();
  });
}

function doLook(){
  const city=CITIES[C.currentCity];
  const idx=C.lookUsed[C.currentCity]||0;
  if(idx>=city.look.length){addMsg('info','Explore','You\'ve already explored everything here.');return;}
  C.lookUsed[C.currentCity]=idx+1;
  addMsg('info','Explore',city.look[idx]);
  renderCity();
}

function issueWarrant(sid){
  C.warrant=sid;
  hideScr('s-dossier');
  addMsg('alert','Warrant Issued','Warrant issued for '+SUSPECTS[sid].name+'! Find the suspect and make the arrest.');
  renderCity();
}

function doArrest(){
  if(C.warrant===null){
    if(!C.msgs.some(m=>m.label==='No Warrant'))addMsg('alert','No Warrant','You need to issue a warrant first! Check your dossier.');
    renderCity();return;
  }
  const isLast=C.trailIdx===C.trail.length-1&&!C.atDeadEnd;
  if(!isLast){
    if(!C.msgs.some(m=>m.label==='No Suspect Found'))addMsg('info','No Suspect Found','The suspect is not in this city. Follow the clues to track them down.');
    renderCity();return;
  }
  S.casesPlayed++;
  if(C.warrant===C.suspect.id){
    S.casesWon++;
    if(S.casesWon>0&&S.casesWon%2===0&&S.rank<RANKS.length-1)S.rank++;
    saveP();showResult('win');
  }else{saveP();showResult('wrong');}
}

function trailGoneCold(){
  S.casesPlayed++;saveP();showResult('cold');
}

function addMsg(type,label,text){C.msgs.push({type,label,text});}

const $=id=>document.getElementById(id);
function showScr(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');}
function hideScr(id){$(id).classList.remove('active');}
function showOvr(id){$(id).classList.add('active');}

function showFlight(fromId,toId,cb){
  const fp=MAP_POS[fromId]||[160,80],tp=MAP_POS[toId]||[160,80];
  const fx=fp[0],fy=fp[1],tx=tp[0],ty=tp[1];
  const mx=(fx+tx)/2,my=Math.max(5,Math.min(fy,ty)-28);
  const pathD='M'+fx+','+fy+' Q'+mx+','+my+' '+tx+','+ty;
  const fromC=CITIES[fromId],toC=CITIES[toId];
  let svg='<svg viewBox="0 0 320 160" class="flight-map">';
  svg+='<rect width="320" height="160" fill="#080c12"/>';
  svg+='<defs><pattern id="fgrid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0L0 0 0 20" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="0.5"/></pattern></defs>';
  svg+='<rect width="320" height="160" fill="url(#fgrid)"/>';
  svg+=CONTINENTS;
  svg+='<path d="'+pathD+'" fill="none" stroke="rgba(45,168,145,0.5)" stroke-width="1.2" stroke-dasharray="4,3" stroke-dashoffset="200"><animate attributeName="stroke-dashoffset" from="200" to="0" dur="1.5s" fill="freeze"/></path>';
  svg+='<circle cx="'+fx+'" cy="'+fy+'" r="3" fill="#d4a843" opacity=".8"><animate attributeName="r" values="3;5;3" dur="1s" repeatCount="indefinite"/></circle>';
  svg+='<circle cx="'+tx+'" cy="'+ty+'" r="3" fill="#2da891" opacity="0"><animate attributeName="opacity" from="0" to=".8" begin=".8s" dur=".5s" fill="freeze"/></circle>';
  svg+='<g><animateMotion dur="1.8s" fill="freeze" rotate="auto" path="'+pathD+'"/><polygon points="-5,0 5,-3 5,3" fill="#2da891"/></g>';
  svg+='<text x="'+fx+'" y="'+(fy-8)+'" text-anchor="middle" fill="#d4a843" font-size="7" font-weight="600" opacity=".8">'+esc(fromC.name)+'</text>';
  svg+='<text x="'+tx+'" y="'+(ty+14)+'" text-anchor="middle" fill="#2da891" font-size="7" font-weight="600" opacity="0"><animate attributeName="opacity" from="0" to=".8" begin="1s" dur=".5s" fill="freeze"/>'+esc(toC.name)+'</text>';
  svg+='</svg>';
  const content='<p class="flight-label">In Transit</p>'+svg+'<div class="flight-route"><span class="fa">'+fromC.flag+' '+esc(fromC.name)+'</span><span class="arrow">→</span><span class="fb">'+toC.flag+' '+esc(toC.name)+'</span></div><div class="flight-cost">'+DIFF[S.diff].travel+' hours travel time</div>';
  $('flight-content').innerHTML=content;
  showScr('s-flight');
  setTimeout(cb,2200);
}

function renderTitle(){
  $('title-rank').textContent=S.casesWon>0?'Rank: '+RANKS[S.rank]+' · Cases Solved: '+S.casesWon:'';
  $('btn-new').textContent=S.casesPlayed===0?'Accept Your First Case':'Accept Your Next Case';
  document.querySelectorAll('.diff-chip').forEach(c=>{c.classList.toggle('active',c.dataset.d===S.diff);});
  $('diff-desc').textContent=DIFF[S.diff].desc;
  showScr('s-title');
}

function renderBriefing(){
  $('b-title').textContent=C.item.name+' has been stolen!';
  $('b-body').innerHTML='Agent, we have a crisis. <span class="stolen">'+esc(C.item.name)+'</span> — '+esc(C.item.desc)+' — has been stolen from <span class="origin">'+esc(CITIES[C.item.origin].name)+', '+esc(CITIES[C.item.origin].country)+'</span>! A member of V.I.L.E.\'s criminal network is responsible.';
  $('b-foot').textContent='Track the thief across the globe. You have '+DIFF[S.diff].hours+' hours before the trail goes cold. ('+DIFF[S.diff].label+' difficulty)';
  showScr('s-briefing');
}

function renderCity(){
  const city=CITIES[C.currentCity];
  const d=DIFF[S.diff];
  $('hud-t').textContent='⏰ '+C.hours+' hrs remaining';
  $('hud-r').textContent='Rank: '+RANKS[S.rank];
  $('city-art-wrap').innerHTML=drawCity(C.currentCity);
  $('c-flag').textContent=city.flag;
  $('c-name').textContent=city.name;
  $('c-country').textContent=city.country;
  $('city-desc').textContent=city.desc;

  const body=$('city-body');body.innerHTML='';
  for(const m of C.msgs){
    const div=document.createElement('div');
    div.className='msg '+(m.type==='clue'?'clue':m.type==='alert'?'alert':'info');
    div.innerHTML='<div class="lbl">'+esc(m.label)+'</div>'+esc(m.text);
    body.appendChild(div);
  }
  body.scrollTop=body.scrollHeight;

  const acts=$('actions');acts.innerHTML='';
  const isLast=C.trailIdx===C.trail.length-1&&!C.atDeadEnd;
  const q=C.cq[C.currentCity];
  const onTrail=!C.atDeadEnd;
  const canSearch=q&&q.si<q.search.length&&C.hours>=1&&onTrail;
  const canWitness=q&&q.wi<q.witness.length&&C.hours>=1&&onTrail;
  const canAirport=q&&q.ai<q.airport.length&&C.hours>=1&&onTrail;
  const lookLeft=city.look&&(C.lookUsed[C.currentCity]||0)<city.look.length;
  const canTravel=C.hours>=d.travel&&!isLast;
  const canGoBack=C.atDeadEnd&&C.hours>=1;

  const stuck=!isLast&&!canTravel&&!(C.atDeadEnd&&canGoBack);

  mkBtn(acts,'🔍 Explore','',lookLeft,doLook);
  mkBtn(acts,'🗣️ Witnesses','',canWitness,doWitness);
  mkBtn(acts,'🕵️ Search Clues','',canSearch,doSearch);
  mkBtn(acts,'📡 Airport Records','',canAirport,doAirport);
  mkBtn(acts,'📋 Dossier','',true,()=>renderDossier());

  if(stuck){
    if(!C.msgs.some(m=>m.label==='Trail Gone Cold'))addMsg('alert','Trail Gone Cold','You don\'t have enough time to continue the pursuit. The suspect has slipped away.');
    body.innerHTML='';
    for(const m of C.msgs){
      const div=document.createElement('div');
      div.className='msg '+(m.type==='clue'?'clue':m.type==='alert'?'alert':'info');
      div.innerHTML='<div class="lbl">'+esc(m.label)+'</div>'+esc(m.text);
      body.appendChild(div);
    }
    const b=mkBtn(acts,'❌ Case Report','cold full',true,trailGoneCold);b.classList.add('full');
  } else {
    if(canGoBack){const b=mkBtn(acts,'🔙 Go Back (1 hr)','go-back full',true,doGoBack);b.classList.add('full');}
    if(canTravel){const b=mkBtn(acts,'✈️ Travel ('+d.travel+' hrs)','travel full',true,()=>renderTravel());b.classList.add('full');}
    if(isLast||C.warrant!==null){const b=mkBtn(acts,'🚔 Make Arrest','primary full',true,doArrest);b.classList.add('full');}
  }

  showScr('s-city');
}

function mkBtn(p,text,cls,en,fn){
  const b=document.createElement('button');
  b.className='act'+(cls?' '+cls:'');
  b.textContent=text;b.disabled=!en;
  b.addEventListener('click',fn);
  p.appendChild(b);return b;
}

function renderTravel(){
  const{options}=getTravel();
  $('travel-cost').textContent='Choose your destination. ('+DIFF[S.diff].travel+' hours)';
  const list=$('travel-list');list.innerHTML='';
  for(const cid of options){
    const city=CITIES[cid];
    const b=document.createElement('button');b.className='dest';
    b.innerHTML='<span class="df">'+city.flag+'</span><div><span class="dc">'+esc(city.name)+'</span><br><span class="dk">'+esc(city.country)+'</span></div>';
    b.addEventListener('click',()=>doTravel(cid));
    list.appendChild(b);
  }
  showOvr('s-travel');
}

function renderDossier(){
  const d=$('dossier-c');d.innerHTML='';
  d.innerHTML='<h2>📋 Case Dossier</h2>';
  let sec=document.createElement('div');sec.className='dsec';
  sec.innerHTML='<h3>Case</h3><div class="trow"><span class="tl">Stolen</span><span class="tv">'+esc(C.item.name)+'</span></div><div class="trow"><span class="tl">From</span><span class="tv">'+esc(CITIES[C.item.origin].name)+'</span></div><div class="trow"><span class="tl">Difficulty</span><span class="tv">'+DIFF[S.diff].label+'</span></div>';
  d.appendChild(sec);

  sec=document.createElement('div');sec.className='dsec';
  sec.innerHTML='<h3>Suspect Profile</h3>';
  for(const cat of CATS){
    const val=C.dossier[cat];
    sec.innerHTML+='<div class="trow"><span class="tl">'+CAT_LABELS[cat]+'</span><span class="tv'+(val?'':' unk')+'">'+esc(val||'Unknown')+'</span></div>';
  }
  d.appendChild(sec);

  sec=document.createElement('div');sec.className='dsec';
  sec.innerHTML='<h3>V.I.L.E. Suspects</h3>';
  for(const s of SUSPECTS){
    const match=CATS.every(cat=>{if(!C.dossier[cat])return true;return s[cat]===C.dossier[cat];});
    const card=document.createElement('div');
    card.className='scard'+(match?' match':' elim');
    const traits=s.hair+' hair · '+s.food+' · '+s.hobby+' · '+s.feature;
    const portraitHtml=drawPortrait(s);
    if(match){
      card.innerHTML=portraitHtml+'<div class="si"><div class="sn">'+esc(s.name)+'</div><div class="st">'+esc(traits)+'</div></div>';
      const btn=document.createElement('button');btn.className='wbtn';
      btn.textContent=C.warrant===s.id?'✓ Warrant':'Issue Warrant';
      btn.disabled=C.warrant===s.id;
      btn.addEventListener('click',()=>issueWarrant(s.id));
      card.appendChild(btn);
    }else{
      card.innerHTML=portraitHtml+'<div class="si"><div class="sn">'+esc(s.name)+'</div><div class="st">'+esc(traits)+'</div></div>';
    }
    sec.appendChild(card);
  }
  d.appendChild(sec);

  if(C.cluesFound.length>0){
    sec=document.createElement('div');sec.className='dsec';
    sec.innerHTML='<h3>Evidence Log</h3>';
    const ul=document.createElement('ul');ul.className='elog';
    for(const c of C.cluesFound){
      const li=document.createElement('li');
      li.className=c.type==='suspect'?'sc':'';
      li.textContent=c.displayText;
      ul.appendChild(li);
    }
    sec.appendChild(ul);d.appendChild(sec);
  }

  const btn=document.createElement('button');btn.className='btn btn-out';btn.style.width='100%';
  btn.textContent='Close';btn.addEventListener('click',()=>hideScr('s-dossier'));
  d.appendChild(btn);
  showOvr('s-dossier');
}

function showResult(outcome){
  const card=$('rcard');
  card.className='rcard '+(outcome==='win'?'win':'lose');
  if(outcome==='win'){
    $('r-title').textContent='Case Closed!';
    $('r-body').innerHTML=esc(C.item.name)+' has been recovered!<br><strong>'+esc(C.suspect.name)+'</strong> has been arrested.';
    $('r-rank').textContent='Rank: '+RANKS[S.rank]+(S.casesWon%2===0&&S.rank>0?' — Promoted!':'');
  }else if(outcome==='cold'){
    $('r-title').textContent='Trail Gone Cold';
    $('r-body').innerHTML='You ran out of time! The real thief was <strong>'+esc(C.suspect.name)+'</strong>.<br>'+esc(C.item.name)+' remains missing.';
    $('r-rank').textContent='Better luck next time, '+RANKS[S.rank]+'.';
  }else{
    const wn=SUSPECTS[C.warrant]?SUSPECTS[C.warrant].name:'Unknown';
    $('r-body').innerHTML='You issued a warrant for '+esc(wn)+', but the real thief was <strong>'+esc(C.suspect.name)+'</strong>!<br>'+esc(C.item.name)+' remains missing.';
    $('r-title').textContent='The Suspect Escaped!';
    $('r-rank').textContent='Better luck next time, '+RANKS[S.rank]+'.';
  }
  showScr('s-result');
}

function esc(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

$('btn-new').addEventListener('click',()=>{newCase();renderBriefing();});
$('btn-go').addEventListener('click',()=>{
  addMsg('info','Arrived','You arrive at '+CITIES[C.currentCity].name+', '+CITIES[C.currentCity].country+'. Start investigating — search for clues and talk to witnesses.');
  renderCity();
});
$('btn-cancel-t').addEventListener('click',()=>hideScr('s-travel'));
$('btn-next').addEventListener('click',()=>{newCase();renderBriefing();});
document.querySelectorAll('.diff-chip').forEach(chip=>{
  chip.addEventListener('click',()=>{
    S.diff=chip.dataset.d;saveP();
    document.querySelectorAll('.diff-chip').forEach(c=>c.classList.toggle('active',c.dataset.d===S.diff));
    $('diff-desc').textContent=DIFF[S.diff].desc;
  });
});

loadP();renderTitle();
</script>
